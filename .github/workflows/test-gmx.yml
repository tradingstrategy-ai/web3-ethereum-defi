name: GMX Tests

# NOTE: GMX tests are separated into their own workflow because:
# - They require special handling and may have issues with parallel execution
# - They need extensive debugging and comments about what doesn't work
# - They interact with live/mainnet fork environments that may have race conditions
# - Order execution depends on off-chain keepers which makes parallel testing potentially problematic
# - Currently running in parallel mode, but see comments below about known issues

on:
  push:
    branches: [ master ]
    paths:
      - 'eth_defi/gmx/**'
      - 'tests/gmx/**'
      # GMX fixed-block forks depend on these shared helpers and their
      # committed Arbitrum Foundry RPC-cache seed.
      - 'eth_defi/provider/anvil.py'
      - 'eth_defi/testing/anvil_fork_pool.py'
      - 'eth_defi/testing/fork_blocks.py'
      - 'eth_defi/testing/rpc_cache.py'
      - 'eth_defi/testing/rpc_cache_seed/arbitrum/**'
      - 'tests/conftest.py'
      - '.github/workflows/test-gmx.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'eth_defi/gmx/**'
      - 'tests/gmx/**'
      # Keep the dedicated suite coupled to its shared fixed-fork machinery.
      - 'eth_defi/provider/anvil.py'
      - 'eth_defi/testing/anvil_fork_pool.py'
      - 'eth_defi/testing/fork_blocks.py'
      - 'eth_defi/testing/rpc_cache.py'
      - 'eth_defi/testing/rpc_cache_seed/arbitrum/**'
      - 'tests/conftest.py'
      - '.github/workflows/test-gmx.yml'
  # The push/PR `paths:` filters above already ensure this workflow only runs
  # when GMX code, tests or their fixed-fork support changes, so the full
  # (slow, order-execution) suite runs only for relevant changes. No
  # time-based schedule is needed; manual dispatch is kept for on-demand runs.
  workflow_dispatch: {}

jobs:
  test-gmx-serial:
    # Reserved multicore instance for running tests
    runs-on:
      group: Beefy runners
    # Hard 15-minute cap — do NOT raise it. GMX tests only run when GMX files
    # change (paths filter above); if the full suite exceeds 15 min, fix the test
    # runs (the slow order-execution files, warm cache), not the timeout. Growing
    # a CI timeout hides the real slowdown instead of surfacing it.
    timeout-minutes: 15

    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false || github.event_name == 'push'

    # Only run the action for the latest push
    # See https://docs.github.com/en/actions/using-jobs/using-concurrency#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ matrix.python-version }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    name: GMX Tests - Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Poetry must be installed before setup-python for cache to work
      # https://github.com/python-poetry/poetry/blob/main/CHANGELOG.md
      - name: Install poetry (using matrix Python)
        run: pipx install "poetry>=2.3" --python "${{ env.PYTHON_PATH }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          # Key the built-in Poetry cache on the lockfile so it invalidates on a
          # locked-dependency change and hits when only source changes.
          cache-dependency-path: |
            poetry.lock
            **/pyproject.toml

      # The virtualenv is cached by actions/setup-python (cache: "poetry", keyed
      # on poetry.lock above), so no separate venv-cache step is needed.
      # Install dependencies with the specific Web3.py version
      # Using a single installation command to avoid conflicts
      - name: Install dependencies
        run: |
            poetry install
            poetry install -E docs -E data -E test -E hypersync -E ccxt -E duckdb -E posts

      # Cache the immutable Foundry toolchain binaries. The fork RPC cache is not
      # an Actions cache — it ships in the repo (see below).
      - name: Cache Foundry toolchain
        uses: actions/cache@v4
        with:
          path: ~/.foundry/bin
          key: foundry-toolchain-v1.2.3-${{ runner.os }}
          restore-keys: |
            foundry-toolchain-v1.2.3-
            foundry-toolchain-

      # No fork RPC cache step: the warm fork cache ships in the repo
      # (eth_defi/testing/rpc_cache_seed/, auto-applied by the
      # _seed_foundry_rpc_cache session fixture). See eth_defi/testing/README.md.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # pick a nightly release from: https://github.com/foundry-rs/foundry/releases
          # version: "nightly-de33b6af53005037b463318d2628b5cfcaf39916"
          #version: "nightly-fdd321bac95f0935529164a88faf99d4d5cfa321"
          version: "v1.2.3"

      # Verify the correct Web3.py version is installed
      # This helps debug any remaining issues.
      # Uses importlib.metadata because pkg_resources was removed from
      # setuptools in Python 3.14.
      - name: Verify Web3.py version and environment isolation
        run: |
          echo "=== Environment Information ==="
          poetry env info
          echo ""
          echo "=== Python Version ==="
          poetry run python --version
          echo ""
          echo "=== Web3.py Version ==="
          poetry run python -c "import web3; print(f'Web3.py version: {web3.__version__}')"
          echo ""
          echo "=== Installed Packages (Web3-related) ==="
          poetry run python -c "
          from importlib.metadata import distributions
          web3_packages = [d for d in distributions() if 'web3' in d.metadata['Name'].lower() or 'eth' in d.metadata['Name'].lower()]
          for d in sorted(web3_packages, key=lambda x: x.metadata['Name']):
              print(f'{d.metadata[\"Name\"]}: {d.metadata[\"Version\"]}')
          "

      - name: Run GMX tests (PARALLEL)
        run: |
          set -o pipefail
          # Read-only open-position tests carry the stable
          # "fork:arbitrum:midnight:readonly" xdist group and share a warmed
          # session Anvil fork. Mutable fork tests instead start fresh
          # fixed-block forks, avoiding shared-state contamination while still
          # using the committed Foundry RPC cache.
          #
          # The full suite runs only for GMX or fixed-fork support changes. If
          # it exceeds the job cap, profile the fork tests instead of extending
          # it.
          #
          # Always use verbose pytest output so stalled CI runs show the latest
          # test names in the Actions log.
          poetry run pytest tests/gmx/ --timeout-method=thread --tb=native -n 4 --dist loadgroup -v -s --capture=no
        env:
          # Arbitrum mainnet RPC is required for GMX tests (GMX is on Arbitrum)
          # Used for mainnet fork testing in conftest.py
          JSON_RPC_ARBITRUM: ${{ secrets.JSON_RPC_ARBITRUM }}
          # Historical GMX event ingestion uses the common Hypersync backend.
          HYPERSYNC_API_KEY: ${{ secrets.HYPERSYNC_API_KEY }}
          # Arbitrum Sepolia testnet RPC for testnet GMX tests
          # Used for testnet integration tests
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          # Private key for GMX test transactions on Arbitrum Sepolia testnet
          # Required for testnet tests that need to submit transactions
          ARBITRUM_GMX_TEST_SEPOLIA_PRIVATE_KEY: ${{ secrets.ARBITRUM_GMX_TEST_SEPOLIA_PRIVATE_KEY }}

      # NOTE: We don't run linting here as it's already done in the main workflow
      # Ruff lint check is only needed once per PR, not per test suite
