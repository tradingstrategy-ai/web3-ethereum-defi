<title id="title">Observed Infinit fund movements</title>
<desc id="desc">Actual Arbitrum deposit calls mint inUSDC while USDC goes to a custody Safe. Separate wallet transfers fund the Hyperliquid bridge. The credited account deposits into and withdraws from a legacy native vault, then moves collateral between native and xyz balances. Reviewed on 26 October 2026 through Arbitrum block 518462154.</desc>
