name: Lighter
slug: lighter
short_description: |
  Native perpetual trading pools on Lighter DEX (ZK-rollup).
long_description: |
  Lighter is a decentralised perpetual futures exchange with an
  Ethereum-settled ZK-rollup deployment and a Robinhood Chain deployment.
  It uses custom zero-knowledge circuits for verifiable order
  matching and liquidations, delivering low-cost, low-latency trading
  with cryptographic proofs.

  Public pools allow operators to trade perpetuals using pooled funds
  from depositors. The main protocol pool is the LLP (Lighter Liquidity
  Pool), which provides market-making liquidity across all trading pairs.

  Ethereum pools are denominated in USDC and have a 5-minute withdrawal
  cooldown. Robinhood Chain pools are denominated in USDG and currently
  have no protocol withdrawal cooldown. These settings are deployment-specific.

  Key features:

  - Zero maker/taker fees for standard accounts
  - Operators set per-pool performance fees (0-100%), charged on positive profits upon withdrawal
  - LLP protocol pool has 0% operator fee
  - Verifiable matching and liquidations
  - Deployment-specific withdrawal cooldowns
  - USDC on Ethereum and USDG on Robinhood Chain
fee_description: |
  Pool operators set a per-pool performance fee (operator fee) that is
  deducted from a participant's positive profits upon withdrawal. This is
  an externalised fee: share-price returns are gross of the operator fee,
  which must be deducted to calculate investor net returns. The LLP
  protocol pool has a 0% operator fee; user-created pools have individually
  configured rates. Operator performance fees are separate from exchange
  trading fees and network transfer or withdrawal charges. Zero maker/taker
  fees apply to Standard accounts; Plus and Premium accounts have trading fees.

  This treatment follows [Lighter's public-pool documentation](https://docs.lighter.xyz/trading/public-pools)
  and is corroborated by the worked public-pool example in the
  [Cipher Intelligence guide](https://cipher-intelligence.io/blog/lighter-dex-lp-staking-guide/).
