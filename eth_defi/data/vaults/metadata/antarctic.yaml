name: Antarctic
slug: antarctic
short_description: |
  USDT-denominated market-making and hedging liquidity pools for perpetual futures.
long_description: |
  [Antarctic Exchange](https://www.antarctic.exchange/) offers perpetual futures trading
  supported by two liquidity pools: AMLP for market-making and AHLP for hedging, as
  described in its [liquidity model](https://docs.antarctic.exchange/antarctic-overview/liquidity-provider-protection).
  AMLP takes the opposite side of traders' gains and losses. The precise hedge instruments
  used by AHLP are not established in the reviewed documentation.

  The [hybrid LP design](https://docs.antarctic.exchange/technical-framework/hybird-lp-model)
  combines smart-contract deposits and redemptions with offchain components. These Arbitrum
  products use USDT-denominated shares and are exposed to trading losses, stablecoin and
  settlement risks. The [FAQ](https://docs.antarctic.exchange/faq) describes a seven-day
  AMLP removal wait followed by manual unlocking and confirmation; exits are asynchronous
  and configuration may change. Separately distributed staking income is distinct from
  changes in the value of LP shares.
fee_description: |
  LP management, performance and redemption fees have not been established in the reviewed
  public material. Exchange maker/taker trading charges are not an LP management fee
  schedule. See the [Antarctic FAQ](https://docs.antarctic.exchange/faq) for trading charges
  and withdrawal conditions; unknown LP fee rates must not be interpreted as zero.
