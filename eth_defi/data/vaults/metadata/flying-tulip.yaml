name: Flying Tulip
slug: flying-tulip
short_description: |
  Flying Tulip distributes income from lending and other strategies as FT token rewards for sftUSD holders or automatically reinvested ftUSD rewards for ssftUSD holders.
long_description: |
  [Flying Tulip](https://flyingtulip.com/) is an onchain lending and trading platform
  founded by [Andre Cronje](https://blog.flyingtulip.com/flying-tulip-raises-200m/).
  It manages ftUSD, a token designed to track the US dollar, and two optional
  staking vaults. sftUSD pays separately claimable rewards in FT, Flying Tulip's
  token. ssftUSD automatically reinvests its ftUSD rewards, increasing the
  ftUSD represented by each share. Flying Tulip [introduced ssftUSD in September 2026](https://blog.flyingtulip.com/flying-tulip-september-update/).

  The [product documentation](https://docs.flyingtulip.com/product-suite/ft-usd/#yield-sources)
  describes income from the money backing ftUSD and ssftUSD's slightly smaller
  reward allocation than sftUSD. It lists stablecoin lending through Aave and
  savings through Spark. Other documented strategies use stablecoins as
  collateral to borrow assets such
  as ETH and stake them, earning the difference between staking returns and
  borrowing costs. Another route deposits a staking asset such as staked ETH,
  borrows a matching amount of ETH, sells the borrowed ETH for dollars and
  invests those dollars for income. The borrowing aims to offset cryptocurrency
  price movements, an approach called delta-neutral carry. Flying Tulip's [June 2026 update](https://blog.flyingtulip.com/flying-tulip-june-update/)
  reported deploying this approach on Ethereum and Sonic. The documentation
  describes available strategies rather than current allocations on every
  network. Protocol revenue also contributes to rewards, and Flying Tulip's
  treasury decides distributions.

  These strategies depend on borrowing costs, staking returns and lenders'
  collateral requirements. Positions can be liquidated if collateral becomes
  insufficient, and withdrawals depend on available funds and the protocol's
  withdrawal rate limits. ftUSD can trade below its dollar target if backing
  assets lose value or cannot be sold promptly.

  In September 2025, Flying Tulip announced a $200 million private round
  involving Brevan Howard Digital, CoinFund, FalconX and Susquehanna Crypto.
  A [20 February 2026 update](https://blog.flyingtulip.com/flying-tulip-sale-update/)
  reported approximately $183.9 million raised across its private,
  institutional, community and public sale rounds after some earlier
  participants exited.

  Primary token-sale participants received FT positions with a
  [continuing redemption right, called a perpetual PUT](https://docs.flyingtulip.com/capital-allocation/).
  Participants can return their position and reclaim the same asset and amount
  they originally contributed, while withdrawing the FT permanently gives up
  that right. This right belongs to the token-sale position and is separate
  from the staking vaults' lending and staking income. The project's February
  update states that income from contributed capital funds team operations;
  the team received no initial token allocation. Redemptions depend on
  available reserves and the protocol's rules.
fee_description: |
  In the staking contracts checked in August and October 2026, sftUSD and
  ssftUSD do not deduct management, performance, deposit or withdrawal fees.
  ssftUSD receives a slightly smaller share of rewards than sftUSD, as described
  in the [product documentation](https://docs.flyingtulip.com/product-suite/ft-usd/).

  Buying ftUSD with USDC and converting it back carry separate charges. Rates
  checked on 24 August 2026 were 0.07% in each direction on Ethereum and Sonic,
  and 0.10% on BNB Chain. These charges depend on the asset used and can change;
  check the application quote for current rates. The [Ethereum conversion contract](https://etherscan.io/address/0xAa48EcBC843cF7E9A29155D112b8Cb27902bD23C#code)
  records the onchain settings. Optional ssftUSD transactions submitted by a
  relayer can carry an agreed service fee. Users also pay network fees and,
  when selling FT rewards, trading costs and any loss from price impact.
