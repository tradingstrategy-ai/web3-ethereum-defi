name: Rysk
slug: rysk
short_description: |
  Epoch-settled liquidity pools for cash-secured puts and fully collateralised calls.
long_description: |
  [Rysk Premium](https://docs.rysk.finance/rysk-premium/rysk-premium-explainer)
  lets liquidity providers deposit collateral into pools that write options. Deposits and
  withdrawals are queued within discrete epochs and are converted at the price per share
  submitted at an epoch boundary. Put collateral is fully cash-secured and call collateral is
  the underlying notional.

  A pool's displayed TVL is its free and allocated collateral. The full price per share uses
  NAV after accounting for the marked value of open option positions and accrued protocol and
  curator fees, as described in Rysk's
  [Premium explainer](https://docs.rysk.finance/rysk-premium/rysk-premium-explainer).
fee_description: |
  Rysk Premium deducts protocol and curator fees from option premium before the remainder
  accrues to liquidity providers. See the
  [Premium explainer](https://docs.rysk.finance/rysk-premium/rysk-premium-explainer)
  for the option-writing and fee flow.
