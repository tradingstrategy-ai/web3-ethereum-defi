name: Gains Network
slug: gains-network
short_description: |
  Counterparty liquidity vaults for gTrade's synthetic leveraged markets.
long_description: |
  [Gains Network](https://gains.trade/) operates gTrade, a decentralised leveraged-trading platform for crypto, forex, stocks, indices and commodities. Its [gToken vaults](https://docs.gains.trade/liquidity-farming-pools/gtoken-vaults) pool collateral to act as the counterparty to trades instead of maintaining separate order books for each market.

  Depositors receive tokenised shares and a portion of trading fees. Trader losses build the overcollateralisation buffer; trader profits draw on vault liquidity, and depositor value can fall when the buffer is insufficient. Each vault retains exposure to its collateral asset and to oracle, smart-contract and administrative risks.

  [Withdrawals](https://docs.gains.trade/liquidity-farming-pools/gtoken-vaults/staker-faq) require a request followed by a claim in a designated epoch, with the delay depending on collateralisation. The [December 2022 gToken announcement](https://medium.com/gains-network/introducing-gtoken-vaults-ea98f10a49d5) explains the original design; current product documentation takes precedence over historical parameters.

  Other operators also use Gains-compatible contracts. Contract compatibility alone does not establish that Gains Network operates a deployment; consult each vault's operator information and notes.
fee_description: |
  Vault income includes a share of fees paid by traders. The trader fee schedule and the share allocated to liquidity providers can change; a zero management or performance fee does not imply a guaranteed return or protection from trader PnL losses.
