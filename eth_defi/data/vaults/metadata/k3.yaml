name: K3
slug: k3
short_description: K3 offers manager-operated vaults that pool bitcoin-backed tokens and dollar-denominated assets and settle deposits and withdrawals in batches.
long_description: |
  [K3 Capital](https://www.k3.capital/) operates vaults that accept bitcoin-backed
  tokens, USDe, USDC and AUSD. Depositors receive shares representing their claims on managed assets.

  The cirBTC product [borrows USDC against deposited cirBTC](https://x.com/k3_capital/status/2119852361879556335)
  and invests it to earn income above the borrowing cost, converting the difference into cirBTC.
  Its [mandate](https://x.com/k3_capital/status/2119852385367740877) permits lending and selected
  [principal tokens](https://tradingstrategy.ai/glossary/principal-token), which represent an investment's
  redemption value at a future date. Depositors retain bitcoin price exposure and can lose money
  if borrowing becomes too costly or pledged assets must be sold to repay loans.

  The cbBTC, cirBTC and USDe products process deposits and withdrawals in batches.
  The manager reports investment values and settles requests before users can
  claim shares or tokens, with no guaranteed settlement time. The [product documentation](https://github.com/K3-Capital/k3-vault-contracts/blob/main/ARCHITECTURE.md)
  explains their reliance on the manager's valuations and the absence of request cancellation.

  The [USDC product](https://basescan.org/address/0x8c4f97ce5b2eea713728729aec08e48bce588216#code)
  and [AUSD product](https://monadscan.com/address/0x1cca0fc4ce416893fe5e74039c4c81a4d10e6806#code)
  instead hold shares in another investment vault. Their requests depend on
  that vault's settlement, may be reduced under its rules, and are subject to
  account blocking. Investors remain exposed to investment losses, delayed
  withdrawals and risks associated with the deposited token.
fee_description: |
  The [cbBTC product's default fees](https://docs.k3.capital/vault-infra/introduction/cbbtc-vault.html)
  are **0% management and 5% performance**, with vault-specific terms taking
  precedence. Borrowing and other investment costs also reduce returns.

  K3's [accounting documentation](https://github.com/K3-Capital/k3-vault-contracts/blob/main/ARCHITECTURE.md)
  requires reported investment values to reflect management, performance and
  strategy fees already charged. Fee rates are not publicly specified for the
  cirBTC, USDe, USDC and AUSD products.
