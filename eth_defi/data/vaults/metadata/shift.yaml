name: Shift
slug: shift
short_description: |
  Automated USDC yield vaults using market-neutral perpetual-DEX strategies.
long_description: |
  [Shift](https://shiftprotocol.xyz/) is an automated DeFi vault protocol for
  strategies including funding-rate arbitrage, basis trading and yield-bearing
  stablecoins. Users hold ERC-20 vault shares that represent their allocation
  to the selected strategy.

  The reviewed `ltPARA`, `extUSD` and `ltLLP` products are custom ShiftVault
  contracts on Base and Arbitrum, not ERC-4626 vaults. Deposits use an
  executor-approved request flow. Withdrawals require executor batch
  resolution and a timelock measured from the withdrawal request, so this
  integration deliberately does not offer public transaction builders.

  The share price is sourced from Shift's onchain TVL feed rather than the
  vault contract's token balance. A stale TVL feed returns a zero share price;
  callers should treat that as unavailable valuation rather than a loss of all
  assets. Strategy, oracle, executor, cross-chain settlement and withdrawal
  delay risks remain material.
fee_description: |
  Shift documents a typical annual management fee of 0–2% and a performance
  fee of 0–20%, varying by strategy. Both are accrued by minting vault shares
  to the treasury, diluting existing holders rather than being deducted as a
  separate redemption charge. The documented general policy has no deposit or
  withdrawal fee; always check the selected product's current terms.
