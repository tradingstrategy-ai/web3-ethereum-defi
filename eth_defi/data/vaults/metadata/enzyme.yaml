name: Enzyme
slug: enzyme
short_description: |
  Infrastructure for Enzyme Blue and Onyx tokenised digital-asset investment vehicles.
long_description: |
  Enzyme provides two distinct architectures for creating and operating
  tokenised investment vehicles. Investors hold ERC-20 shares representing
  their interest in a vehicle, while its manager sets the strategy and
  operating configuration.

  Enzyme Blue uses a VaultProxy ERC-20 share token with a paired
  ComptrollerProxy. The VaultBase scanner discovers reviewed Blue Dispatcher
  deployments on Ethereum, Polygon, Base and Arbitrum, and reads current and
  historical GAV, TVL and share price directly from the contract pair.

  Enzyme Onyx uses a standalone Shares token and modular components. The
  supported Base scanner discovers official Onyx SharesFactory deployments and
  publishes each vehicle's share price and supply in a selected accounting
  unit, which may be a named unit such as USD. USD-denominated investment
  vehicles are presented in USDC terms for like-for-like comparison with other
  USD vaults; their specific subscription handler can nevertheless accept a
  different token. Blue current
  metadata recognises the reviewed allowed-deposit-recipients policy. Onyx
  Shares cannot enumerate deposit handlers, so its current deposit permission
  remains unknown. Historical open/closed deposit and redemption status is not
  exported for either architecture: policies and handlers are mutable and can
  be specific to an investor or action.
fee_description: |
  Fee configuration differs by architecture. Enzyme Blue can combine
  fund-level FeeManager fees with a separate protocol fee. The scanner exports
  the current Blue management fee as the user-facing sum of both rates, and
  also exports the protocol component for transparency. Consumers must not add
  the component to management a second time. Historical Blue fee configuration
  remains TODO.

  Enzyme Onyx's standard FeeHandler has management, performance, entrance and
  exit fees configured per vehicle, with no separate protocol-fee setting. Its
  exported management rate is therefore the full current user-facing recurring
  charge. Historical Onyx fee rates are not yet exported.
