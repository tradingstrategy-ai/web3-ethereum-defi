short_description: |
  Frankencoin issues ZCHF, a decentralised stablecoin designed to track the Swiss franc.
long_description: |
  Frankencoin is a decentralised Swiss franc stablecoin. Its ZCHF token is designed
  to keep a 1:1 value with the Swiss franc while remaining transparent, onchain and
  usable without relying on a single central issuer. See the
  [official protocol documentation](https://docs.frankencoin.com/).

  The protocol is backed by onchain collateral that can be liquidated when needed
  to protect the value of ZCHF. Frankencoin has been live since 2023 and is deployed
  across multiple blockchains.

  Common ways to use Frankencoin include:

  - Pay with digital Swiss francs through DeFi, payment cards, IBAN integrations,
    and supported merchants.
  - Borrow ZCHF by depositing crypto assets as collateral.
  - Earn market-based yield on ZCHF through DeFi applications and the Frankencoin
    savings module.
  - Build applications and financial services that need a programmable Swiss franc
    settlement layer.

  The Frankencoin Savings Vaults wrap the savings module as ERC-20 and ERC-4626
  vault tokens. Users deposit ZCHF and receive svZCHF shares whose value follows
  the savings module yield.

  [Frankencoin Shares (FCS)](https://frankencoin.com/fcs) provide loss-bearing
  equity participation in the reserve behind ZCHF, alongside time-weighted
  governance rights. Net protocol income increases the backing capital and
  losses reduce it. FCS can lose its entire value. The reference valuation,
  backing capital and secondary-market price are distinct quantities.
  Its underlying revenue comes from [collateralised ZCHF borrowing fees and
  position proposals](https://docs.frankencoin.com/positions/open), plus net
  liquidation results. [Accepted collateral](https://app.frankencoin.com/monitoring/collateral)
  includes crypto assets and tokenised gold, giving FCS indirect lending and
  RWA lending exposure. [Savings interest](https://docs.frankencoin.com/savings)
  is paid from equity and reduces the net income available to shareholders.
  [Direct redemption](https://docs.frankencoin.com/pool-shares/fcs) depends on
  the wrapper's underlying voting power and holding duration and applies
  size- and activity-dependent discounts. Market sales depend on venue liquidity.
fee_description: |
  Frankencoin Savings Vaults do not have protocol-wide management, performance,
  deposit, or withdrawal fees. Yield accrues through the savings module and is
  reflected in the svZCHF share price.

  The savings contracts support an optional per-account referral fee. If a user
  configures a referrer, up to 25% of earned interest can be deducted and paid
  to that referrer. Users can remove or change the referrer.

  FCS has no recurring management or performance fee. Its underlying equity
  curve applies a 0.3% entry fee and a nominal 0.3% exit fee through the
  redeemed-share calculation. FCS also applies a variable redemption discount,
  so the exit cost cannot be represented by a single fixed percentage. See the
  [equity contract](https://github.com/Frankencoin-ZCHF/Frankencoin/blob/main/contracts/equity/Equity.sol)
  and [FCS accounting contract](https://github.com/Frankencoin-ZCHF/Frankencoin/blob/main/contracts/equity/shares/FCSMintRedeem.sol).
