name: Llama Lend
slug: llama-lend
short_description: |
  Curve Finance's isolated lending markets with LLAMMA soft liquidations.
long_description: |
  Llama Lend is Curve Finance's isolated lending protocol. Lenders supply a market's borrowed
  token and receive ERC-4626 shares whose value accrues borrower interest. Borrowers pledge
  a separate collateral token to secure their loans.

  LLAMMA (Lending Liquidating Automated Market Maker Algorithm) rebalances borrower collateral
  through soft liquidations. This mechanism does not guarantee against losses. Lender withdrawals
  require sufficient market liquidity, which is held and accounted for by the controller.
fee_description: |
  V2 deducts protocol fees from borrower interest before it accrues to lenders. These deductions
  are reflected in vault assets and share value, rather than a separate management or performance
  charge reported by this integration.
