name: Veranta
slug: veranta
short_description: A shared USDC pool that earns fees from cryptocurrency, currency and commodity trading.
long_description: |
  #### Trading and income

  [Veranta](https://www.veranta.xyz/), [formerly known as Avantis](https://www.veranta.xyz/blog/introducing-veranta), operates a trading platform on Base where
  traders can take [positions larger than the money they put up](https://docs.veranta.xyz/trading/getting-started/collateral-and-position-sizing). Depositors in its
  [avUSDC vault](https://docs.veranta.xyz/liquidity-providers/veranta-lp-vault-avusdc)
  supply USDC to back trading positions and earn **a share of trading fees**. They
  receive avUSDC tokens representing their share of the pool.

  - Vault depositors receive **70% of fees collected on opening, closing and
    profitable trades** under the protocol's [fee allocation](https://www.veranta.xyz/blog/systematic-avnt-buybacks-and-burns).
  - Vault depositors also receive **100% of margin fees**, which traders pay for
    using the pool's capital.
  - The remaining **30% of fees on opening, closing and profitable trades** buys the
    protocol's AVNT token and permanently removes it from circulation.

  #### Payouts and withdrawals

  Trader losses build a reserve that pays trader profits before drawing on
  deposited capital, so **deposits can lose value** if that reserve runs out.
  [Limits on trading positions and payouts](https://docs.veranta.xyz/trading/limitations-and-safeguards)
  aim to contain the pool's exposure to trader profits.

  Withdrawals depend on money being available in the pool.
  [Withdrawal charges](https://docs.veranta.xyz/liquidity-providers/risk-management)
  can reduce the amount returned when the reserve is low.

fee_description: |
  A **0.5% withdrawal fee** is used for return estimates.
  The actual rate is **dynamic**, depending on the reserve available to cover
  trader profits, as explained in the
  [withdrawal fee documentation](https://docs.veranta.xyz/liquidity-providers/risk-management).

  Depositors pay **no separate management or performance fee** under the
  [vault's fee rules](https://basescan.org/address/0x944766f715b51967e56afde5f0aa76ceacc9e7f9#code).
  The protocol's share of trading revenue is allocated before income reaches
  the pool and is already reflected in the share price.
