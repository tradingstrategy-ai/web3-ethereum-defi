name: Avantis
slug: avantis
short_description: A shared USDC pool that earns fees from cryptocurrency, currency and commodity trading.
long_description: |
  #### Trading and income

  [Avantis](https://www.veranta.xyz/) operates a trading platform on Base where
  traders can take positions larger than their own deposits. Depositors in its
  [avUSDC vault](https://docs.veranta.xyz/liquidity-providers/veranta-lp-vault-avusdc)
  supply USDC to back trading positions and earn **a share of trading fees**. They
  receive avUSDC tokens representing their share of the pool.

  #### Payouts and withdrawals

  Trader losses build a reserve that pays trader profits before drawing on
  deposited capital, so **deposits can lose value** if that reserve runs out.
  Withdrawals depend on money being available in the pool and can incur a
  charge when the reserve is low.

  #### Name change

  Avantis [renamed the protocol Veranta in September 2026](https://github.com/Avantis-Labs/avantis_trader_sdk/blob/main/README.md).
  The avUSDC share token retains its Avantis name.
fee_description: |
  The [withdrawal charge](https://docs.veranta.xyz/liquidity-providers/risk-management)
  ranges from **0% to 2.5%**, depending on the reserve available to cover trader
  profits. This charge reduces the USDC paid out when a depositor withdraws.
  Management and performance fee rates have not been confirmed.
