name: YieldBasis
slug: yield-basis
short_description: |
  YieldBasis creates leveraged Curve liquidity positions so yb-LP holders can earn
  trading fees while retaining exposure to the underlying BTC or ETH market.
long_description: |
  [YieldBasis](https://yieldbasis.com/) is a decentralised liquidity protocol
  built around leveraged positions in Curve Cryptoswap pools. A liquidity
  provider supplies a volatile asset such as WBTC, cbBTC, tBTC or WETH while
  the protocol borrows crvUSD and manages the position through its LEVAMM
  design. The resulting yb-LP share is a claim on protocol-managed pool equity,
  not a deposit account or a principal-protected stablecoin.

  YieldBasis aims to make liquidity provision more efficient by adjusting
  leverage as the market changes. Holders can earn a share of trading activity,
  but the position remains exposed to the asset's USD price, pool
  liquidity, leverage, oracle assumptions and the protocol's redemption rules.
  The value of a share can therefore fall. An immediate redemption can be below
  fundamental value because of the protocol's [Temporary Redemption Discount](https://docs.yieldbasis.com/user/protocol/fundamental-value-redemption-value-and-trd),
  which varies with the product and market state. Returns measured in USD also
  include BTC/ETH price movement.
  See the [YieldBasis overview](https://docs.yieldbasis.com/user/overview/how-yieldbasis-works)
  and [Earn page](https://yieldbasis.com/earn) for the current product terms.
fee_description: |
  YieldBasis allocates product fees by minting LT shares, so those allocations
  are reflected in each holder's share of the product. See the
  [fee mechanics](https://docs.yieldbasis.com/user/protocol/fee-mechanics) for
  the protocol's current distribution. Redemption proceeds can also be below
  fundamental value because of the Temporary Redemption Discount. For USD
  comparisons, the integration models a 0.10% conversion at both entry and exit
  between a generic USD stablecoin and the pool's BTC or ETH token; this is an
  accounting assumption rather than a YieldBasis fee. It excludes price impact,
  Ethereum gas and MEV. Neither trading-fee income nor a quoted annual return
  is guaranteed.
