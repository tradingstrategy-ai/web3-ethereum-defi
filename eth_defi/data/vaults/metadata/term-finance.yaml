name: Term Finance
slug: term-finance
short_description: |
  Noncustodial fixed-rate liquidity protocol modelled on tri-party repo arrangements.
long_description: |
  Term Finance is a noncustodial fixed-rate liquidity protocol modelled on tri-party
  repo arrangements common in traditional finance (TradFi). Liquidity suppliers and
  takers are matched through a unique weekly auction process where liquidity takers
  submit bids and suppliers submit offers to the protocol.

  The protocol determines a "market clearing rate" that matches supply and demand.
  Bidders who bid more than the clearing rate receive loans and lenders asking less
  than the clearing rate supply liquidity.

  Key features:

  - Fixed-rate DeFi lending and borrowing via auctions
  - Scalable transactions with no spread, no slippage, and low fees
  - Collateral sits in isolated noncustodial smart contracts (repoLocker)
  - No rehypothecation - collateral cannot be lent to other borrowers
fee_description: |
  [Term's strategy-vault fee documentation](https://developers.term.finance/periphery-contracts/curated-vaults/administration/yearn-roles-and-governance)
  describes manager-set performance fees collected when profits are reported.
  Rates depend on the vault's current configuration. Fees within underlying
  lending allocations are an additional layer and can have a different
  calculation base.

  The separate [auction servicing fee](https://docs.term.finance/protocol/fees-and-penalties/servicing-fee)
  is charged to borrowers. The absence of a direct auction fee for lenders
  does not establish that a managed strategy vault has no performance fee.
