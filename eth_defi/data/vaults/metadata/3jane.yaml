name: 3Jane
slug: 3jane
short_description: |
  Credit money market whose USD3 and sUSD3 vaults lend USDC to crypto-native borrowers and U.S. fintech lenders, including inventory financing for consumer goods brands.
long_description: |
  3Jane is a credit money market on Ethereum. Depositors supply USDC and receive
  **USD3**, the senior tranche, meaning the class of deposits repaid first, or stake USD3
  for **sUSD3**, the junior tranche that absorbs losses first in return for a larger share
  of the interest. Interest is not paid out separately: each token redeems for more USDC
  over time as borrowers pay.

  The pooled USDC is lent in two ways. **Crypto credit lines** are loans without
  collateral to crypto-native borrowers, sized against their [credit scores and verified
  onchain, exchange and bank balances](https://docs.3jane.xyz/resources/faq). **Fintech
  credit facilities** fund U.S. fintech lenders that make short-term consumer and
  small-business loans, either by lending against the loans they have made, buying a share
  of them, or buying them outright as they are made. Since November 2026 this includes a [$100 million
  forward-flow agreement with Settle](https://x.com/3janexyz/status/2117624841050411120),
  which lends inventory financing, money to buy stock before it is sold, to U.S. consumer
  goods brands. [Idle USDC is held in Aave](https://docs.3jane.xyz/usd3-susd3/suppliers)
  until it is lent out.

  Losses on crypto credit lines are absorbed first by a $1 million insurance fund, then by
  sUSD3 and only then by USD3. Fintech facilities add the originating lender's own
  first-loss capital, excess collateral and reserves ahead of sUSD3. USD3 has no lock and can be
  redeemed as long as the junior tranche still covers its required share of the pool's
  loans, known as the tranche ratio; sUSD3 has a **one-month lock**, followed by a
  cooldown and a withdrawal window. 3Jane operates both vaults itself, so it is also their
  curator.
fee_description: |
  3Jane charges no deposit, withdrawal or redemption fee; [USD3 redemptions are documented
  as having no fee](https://docs.3jane.xyz/resources/faq). Depositors receive the pool's net
  interest through a rising token price rather than a separate payout, and returns from
  fintech facilities are net of the originating lender's servicing costs and expected losses.

  In November 2026 the [USD3 contract](https://etherscan.io/address/0x056B269Eb1f75477a8666ae8C7fE01b64dD55eCc#readContract)
  passed **10%** of the senior tranche's interest to the sUSD3 junior tranche. This is the
  senior-to-junior interest allocation that pays for sUSD3's first-loss protection; it goes
  to junior depositors, not to 3Jane, and sUSD3 has no such allocation. No management fee is
  published. See the [supplier documentation](https://docs.3jane.xyz/usd3-susd3/suppliers).
