name: D2 Finance
slug: d2-finance
short_description: |
  D2 Finance operates actively managed vaults trading cryptoassets and traditional financial markets.
long_description: |
  Deposits fund [trading strategies](https://d2.finance/strategies) across cryptoassets,
  equities, commodities and currencies. Strategies can trade contracts tied to asset
  prices, lend assets or supply money to trading pools.
  The investments and risks differ between vaults.

  Trading runs in cycles called [epochs](https://docs.d2.finance/docs/vault-design).
  **Deposits and withdrawals close during trading**, when the trader may take custody
  of the funds. Withdrawals reopen after the funds return and the cycle ends.

  The platform hosts vaults traded by an external trading team.
  Trading losses, failures in underlying investments or contract bugs can result in
  [loss of the entire deposit](https://docs.d2.finance/docs/disclaimer-and-restrictions).
fee_description: |
  Fees depend on the vault and its strategy. The vault's strategy page lists its fee terms.
