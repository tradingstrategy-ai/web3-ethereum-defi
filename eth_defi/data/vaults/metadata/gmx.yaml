name: GMX
slug: gmx
short_description: |
  GMX is a decentralised perpetual and spot exchange whose GM and GLV pools let liquidity
  providers supply market liquidity and receive a share of protocol fees.
long_description: |
  [GMX](https://gmx.io/) is a decentralised exchange for perpetual futures and spot swaps
  with [active markets on Arbitrum, Avalanche and MegaETH](https://docs.gmx.io/docs/trading/overview/).
  Trading is routed against GM and GLV liquidity pools instead of a central order book, with
  oracle prices used in the protocol's valuation and execution.

  GM markets are individual liquidity pools for a specific market, usually with a long
  token and a short token such as WETH and USDC. GLV pools are automated multi-market
  vaults that allocate liquidity across compatible GM markets. [GMX documentation](https://docs.gmx.io/docs/providing-liquidity/)
  describes both pool types and explains that liquidity providers earn the majority of
  fees generated by trading, liquidations, borrowing and swaps.

  GMX is a [proven success in decentralised derivatives](https://gov.gmx.io/t/gmx-labs-funding-proposal-2026-2027/4979),
  combining [deep onchain liquidity](https://docs.gmx.io/docs/providing-liquidity/) with more than
  [$330 billion in cumulative perpetual trading volume](https://defillama.com/protocol/gmx).
  Its market-specific [GM pools and diversified GLV pools](https://docs.gmx.io/docs/providing-liquidity/)
  have become important building blocks for [traders](https://docs.gmx.io/docs/trading/overview/),
  liquidity providers and [DeFi integrations](https://docs.gmx.io/docs/api/overview/). With active
  deployments on [Arbitrum, Avalanche and MegaETH](https://docs.gmx.io/docs/trading/overview/),
  including its [MegaETH expansion](https://gov.gmx.io/t/gmx-v2-deployment-on-megaeth-proposal/4954),
  and [continued product development](https://gov.gmx.io/t/gmx-labs-funding-proposal-2026-2027/4979),
  GMX remains one of the most established venues for trading perpetual futures directly from a
  crypto wallet.
fee_description: |
  Liquidity providers receive a share of trading, liquidation, borrowing and swap fees.
  Deposits and withdrawals can incur transaction-level costs, including execution fees,
  swap fees, price impact and network gas. GMX fees depend on the market and transaction;
  see the [GMX liquidity documentation](https://docs.gmx.io/docs/providing-liquidity/) for
  current fee sharing and pool mechanics.
