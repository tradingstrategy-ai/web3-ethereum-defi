name: Peapods
slug: peapods
short_description: |
  Decentralised protocol that turns any token into a tradeable "pod" and earns yield from market volatility rather than from token rewards.
long_description: |
  Peapods Finance launched around the end of 2023 with a distinctive idea: turning market volatility into yield. Its core building block is the "pod", a vault into which any token, or a basket of tokens, can be deposited to mint a wrapped version. Because the wrapped token trades separately from the original, every price swing creates small arbitrage opportunities between the two, and the fees generated by this constant wrapping and unwrapping flow back to the pod as yield. Peapods describes this approach as "volatility farming" and bills itself as the first protocol to make it a reusable building block.

  The protocol is best known for two things: letting anyone create tokenised, index-like pods without permission, and its "Leverage Volatility Farming" feature, which lets users borrow from an integrated lending market to build larger positions and increase their volatility yield, while lenders on the other side earn steady interest. A defining feature is that returns come from genuine market activity rather than inflationary token rewards, and pods are always backed at least one-to-one by their underlying deposits.

  Peapods is run by a pseudonymous team and operates across several networks, including Ethereum, Arbitrum, Base, Berachain, Sonic and Mode. It has been through multiple independent security reviews and a public audit contest, and its native token, PEAS, is used for governance and value accrual.
fee_description: |
  Fees depend on the specific Peapods product or vault. Review the current product interface and documentation for management, performance, transaction and redemption costs before depositing.
