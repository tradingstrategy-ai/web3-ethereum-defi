name: Pallas
slug: pallas
short_description: |
  Pallas operates USDT0 trading vaults on HyperEVM with asynchronous subscriptions and redemptions.
long_description: |
  [Pallas](https://app.pallas.fund/) operates strategy vault contracts on
  HyperEVM. The reviewed products accept USDT0, issue PALLAS shares and trade
  Hyperliquid HIP-3 perpetual markets. They include a market-neutral
  basis-trading strategy and a directional long/short strategy.

  Deposits and redemptions use a request-and-claim process rather than an
  immediate swap between USDT0 and shares. A request can therefore remain
  pending until the operator fulfils it. The application is marked as a private
  beta with whitelisted access, so users should confirm their eligibility and
  the current vault state before submitting a request.

  Security notes:

  - The reviewed vaults are verified upgradeable proxy contracts. Authorised
    roles can upgrade the implementation, pause the vault, change fees, set the
    share price and fulfil pending requests.
fee_description: |
  Each Pallas vault has its own annual management fee and profit-based
  performance fee. These fees reduce holder returns through share dilution.
  The application advertises lower effective fees for Premium Pass holders
  through rebates. Rates can change, so users should review the current
  strategy page before requesting a deposit.
