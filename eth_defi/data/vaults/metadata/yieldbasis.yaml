name: YieldBasis
slug: yieldbasis
short_description: |
  YieldBasis offers BTC and ETH liquidity products designed to earn a share of
  trading fees while retaining exposure to the underlying asset.
long_description: |
  [YieldBasis](https://yieldbasis.com/) is a decentralised liquidity protocol
  for BTC and ETH markets. Its [Earn products](https://yieldbasis.com/earn)
  let users provide supported assets, including WBTC, cbBTC, tBTC and WETH, and
  receive yb-LP shares.

  Each share represents a managed liquidity position. YieldBasis is designed to
  let liquidity providers earn from market activity while keeping exposure to
  their chosen BTC or ETH asset. Trading fees generated when people use the
  market are shared with liquidity providers. The [YieldBasis overview](https://docs.yieldbasis.com/user/overview/how-yieldbasis-works)
  explains how its liquidity products work.

  A yb-LP share can rise or fall in value. BTC or ETH prices, pool liquidity,
  leverage and market conditions can all affect the result. An immediate exit
  can also receive less than the product's calculated value because of the
  [Temporary Redemption Discount](https://docs.yieldbasis.com/user/protocol/fundamental-value-redemption-value-and-trd).
  See the [Earn page](https://yieldbasis.com/earn) for current markets and
  product terms.
fee_description: |
  YieldBasis allocates its product fees through LT share accounting. Its
  [fee mechanics](https://docs.yieldbasis.com/user/protocol/fee-mechanics)
  describe how trading fees and protocol allocations are distributed. An
  immediate redemption can realise less than fundamental value because of the
  [Temporary Redemption Discount](https://docs.yieldbasis.com/user/protocol/fundamental-value-redemption-value-and-trd).
  Users may also incur Ethereum network fees and any costs charged by external
  venues used to acquire or sell the underlying asset.
