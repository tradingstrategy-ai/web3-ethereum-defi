- name: Metronome Synth USD
  short_description: Metronome Synth USD (msUSD) is a decentralised synthetic USD asset issued by MetronomeDAO on Ethereum, Base, and Optimism.
  long_description: |
    Metronome Synth USD (msUSD) is a synthetic asset designed to track the US dollar. Users
    mint it against deposited collateral in Metronome's Synth Engine, and can transfer it
    across networks using LayerZero's Omnichain Fungible Token standard.

    ## Incident status

    MetronomeDAO reported on 30 July 2026 that 4.57 million msUSD, around 16% of its supply,
    had no backing after an oracle-lag issue in its swap module created unbacked float. The
    incident report said msUSD traded 25% below its peg at the time. Mark this entry depegged
    manually until the backing shortfall has been resolved and the marker is deliberately
    reviewed. Contract-address matching prevents this status from applying to Main Street USD,
    which uses the same ticker.

    ## Sources

