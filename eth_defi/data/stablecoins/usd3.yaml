long_description: |
  USD3 is the senior deposit token of [3Jane](https://www.3jane.xyz/), a credit money
  market on Ethereum. A depositor supplies USDC and receives USD3 at the current exchange
  rate, which started at one USDC and rises as the lending pool earns interest. Interest is
  not paid out separately: each USD3 redeems for more USDC over time.

  ## Mechanism

  The pooled USDC is lent in two ways. **Crypto credit lines** are loans without
  collateral to crypto-native borrowers, sized against their [credit scores and verified
  onchain, exchange and bank balances](https://docs.3jane.xyz/resources/faq). **Fintech
  credit facilities** fund U.S. fintech lenders that make short-term consumer and
  small-business loans, either by lending against the loans they have made, buying a share
  of them, or buying them outright as they are made. Since November 2026 this includes a [$100 million
  forward-flow agreement with Settle](https://x.com/3janexyz/status/2117624841050411120),
  which lends inventory financing, money to buy stock before it is sold, to U.S. consumer
  goods brands. [Idle USDC is held in Aave](https://docs.3jane.xyz/usd3-susd3/suppliers)
  until it is lent out.

  ## Tranche structure

  USD3 is the **senior tranche**, the class of deposits repaid first. Losses on crypto
  credit lines are absorbed first by a $1 million insurance fund, then by the junior
  sUSD3 tranche and only then by USD3; fintech facilities add the originating lender's own
  first-loss capital and reserves ahead of sUSD3. In return, a share of USD3's interest
  passes to sUSD3. Both tranches earn a floating proportion of what the loans pay, plus
  locked JANE token rewards. USD3 has no lock and can be redeemed for USDC with **no fee**
  as long as the junior tranche still covers its required share of the pool's loans, known
  as the tranche ratio.

