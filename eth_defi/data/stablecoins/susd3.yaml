short_description: |
  sUSD3 is the junior deposit token of the 3Jane credit money market, minted by
  staking USD3. It earns a larger share of the lending pool's interest because it
  absorbs loan losses before USD3, and it carries a one-month lock.
long_description: |
  sUSD3 is the **junior tranche** of [3Jane](https://www.3jane.xyz/), a credit money
  market on Ethereum, and is minted by staking USD3, the senior tranche. Its underlying
  asset is USD3 rather than USDC, so its value follows USD3's redemption value in USDC.

  ## Mechanism

  Junior depositors accept first-loss risk. When a crypto credit line goes bad, the loss is
  taken first by a [$1 million insurance fund](https://docs.3jane.xyz/resources/faq), then by
  sUSD3 and only then by USD3; when a fintech facility loses money, the originating lender's
  own first-loss capital and reserves are used up before sUSD3. In return sUSD3 receives the junior share of the pool's interest,
  including a share of the interest earned by USD3. Interest is not paid out separately:
  each sUSD3 redeems for more USD3 over time, and locked JANE token rewards are paid on top.

  The money behind sUSD3 is the same lending pool that backs USD3: loans without collateral
  to crypto-native borrowers, and facilities funding U.S. fintech lenders, including
  inventory financing for consumer goods brands through Settle. See the USD3 description
  for details.

  ## Withdrawals

  sUSD3 has a [**one-month lock**](https://docs.3jane.xyz/usd3-susd3/suppliers), during
  which it keeps earning. After the lock a holder starts a cooldown and then redeems within
  a withdrawal window. The amount of sUSD3 in issue is capped by the tranche ratio, the
  share of the pool's loans that the junior tranche must cover.

