short_description: Excellion Finance is a delta-neutral DeFi fund.
long_description: |
  Excellion Finance describes itself as a delta-neutral DeFi fund offering investment strategies designed to limit market-direction exposure. Its website presents strategies that use stablecoins, hedging, lending, liquidity provision and arbitrage, alongside strategies focused on BTC and ETH holdings. Lagoon Finance lists Excellion Finance as the curator of the Excellion USDC Vault on Avalanche.

