short_description: C Research is an Asia-based trading team that uses automated models to trade crypto price moves and payments between futures traders.
long_description: |
  C Research runs [automated crypto trading strategies](https://docs.neutral.trade/for-capital-allocators/usdc-yield/directional/cta-longshort-alpha) that follow price trends within the day, anticipate reversals and collect payments between futures traders. It primarily trades [perpetual futures](https://tradingstrategy.ai/glossary/perpetual-future), contracts that track prices without expiring, on [Binance](https://www.binance.com/); other execution venues are not named.

  The team can intervene manually in exceptional circumstances as a safety measure. It is based in Asia and trades predominantly its own capital. **C Research is a published alias**, and the firm's legal name is not disclosed.
