short_description: Antarctic operates a perpetual futures exchange with market-making and hedging liquidity pools.
long_description: |
  [Antarctic Exchange](https://www.antarctic.exchange/) operates a perpetual futures exchange.
  Its [dual-vault liquidity system](https://docs.antarctic.exchange/antarctic-overview/liquidity-provider-protection)
  comprises AMLP for market-making and AHLP for hedging.
  The exchange's [hybrid liquidity model](https://docs.antarctic.exchange/technical-framework/hybird-lp-model)
  combines smart-contract deposits and redemptions with offchain components; no separate
  third-party curator is disclosed for these products.
