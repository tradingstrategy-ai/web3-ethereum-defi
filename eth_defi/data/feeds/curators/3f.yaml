# 3F's Morpho vault is co-branded with Steakhouse Financial, which Morpho
# lists as the risk curator.  The address override in ``eth_defi.vault.curator``
# attributes this specific 3F-branded product to 3F without changing
# Steakhouse's attribution for its other vaults.
feeder-id: 3f
name: 3F
role: curator
website: https://3f.xyz/
short_description: 3F develops onchain leverage infrastructure and Morpho-powered lending vaults for tokenised real-world assets.
long_description: |
  [3F](https://3f.xyz/) develops onchain infrastructure for leveraged strategies involving tokenised real-world assets and other asynchronously settled instruments. Its lender offering lets depositors supply stablecoins to Morpho-powered lending vaults that lend against RWAs. The 3F x Steakhouse USDC vault is co-branded with Steakhouse Financial; Morpho lists Steakhouse Financial as its risk curator, while 3F presents the vault as part of its lending product.
twitter: 3f_xyz

