short_description: Hemi is a Bitcoin-focused DeFi layer that enables compliant yield while users retain custody of their BTC.
long_description: |
  Hemi describes itself as a unified DeFi layer for Bitcoin, designed to turn idle BTC into compliant yield with full ownership and in-custody execution. Its website presents Bitcoin yield products and infrastructure. Lagoon Finance identifies Hemi as co-curator, with Gami, of the Ethereum Gami hemiBTC vault.

# Evidence and background references.
#
# Hemi's official homepage describes its Bitcoin-focused DeFi and yield offering.
# Although Hemi is not returned by Lagoon's curators API, Lagoon's official Gami
# hemiBTC vault page explicitly labels the vault as co-curated by Hemi and Gami.
other-links:
