short_description: Ember offers onchain investment products from its own team and external asset managers.
long_description: |
  [Ember](https://ember.so/) provides the platform for a range of managed onchain investment products. Its own
  Ember Earn vault allocates stablecoins across fixed income, decentralised exchange liquidity, lending and
  trades that seek to capture differences in interest rates. The [product catalogue](https://ember.so/earn)
  also includes strategies run by external managers such as Third Eye and RockawayX. Responsibility for
  investment decisions therefore depends on the manager of each vault.
