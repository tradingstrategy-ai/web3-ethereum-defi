# Yearn Curation curator — feeds provided by protocols/yearn.yaml
feeder-id: yearn
name: Yearn
role: curator
website: https://curation.yearn.fi/
short_description: Yearn develops automated DeFi yield vaults and curates lending portfolios using published risk assessments.
long_description: |
  [Yearn](https://yearn.fi/) develops automated investment vaults that allocate deposits to DeFi strategies.
  Its [curation practice](https://docs.yearn.fi/getting-started/products/curating/introduction) grew out of
  monitoring the Morpho vaults used by Yearn's own strategies. Before allocating to a lending market, it
  assesses collateral, contract controls and liquidity, then sets exposure limits and monitors changes. Yearn
  publishes its [risk reports and market exposures](https://curation.yearn.fi/) so depositors can examine the
  information behind those decisions.
canonical-feeder-id: yearn

