# Yearn Curation curator — feeds provided by protocols/yearn.yaml
feeder-id: yearn
name: Yearn
role: curator
website: https://curation.yearn.fi/
short_description: Yearn Curation selects, monitors and manages DeFi lending-market exposure for Yearn-curated vaults.
long_description: |
  [Yearn Curation](https://curation.yearn.fi/) is Yearn’s risk-management practice for selecting and overseeing DeFi lending markets and vaults. It publishes assessments of contract, control, funds-management, liquidity and operational risks, then uses them to set exposure limits and pursue risk-adjusted yield rather than simply the highest yield. Automated monitoring tracks market liquidity, utilisation, governance and contract changes; when alerts trigger, Yearn can reduce allocations or move funds out of affected markets. These controls seek to manage risk, but they cannot remove the smart-contract, liquidity, market or governance risks of DeFi.
canonical-feeder-id: yearn

