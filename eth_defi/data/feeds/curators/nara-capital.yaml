short_description: Nara Capital curates a stablecoin portfolio that combines lending, liquidity provision and hedged trading.
long_description: |
  Nara Capital is the curator of [GUSDC on Lagoon
  Finance](https://app.lagoon.finance/vault/8453/0xd5c22fa3f7ee979ed7c28e36669b29797ab277e4). The portfolio
  operates across blockchains and combines lending, liquidity provision and delta-neutral positions, which aim
  to limit sensitivity to market price movements. Lagoon's published description states that withdrawals are
  available within 48 hours. The listing does not provide a company website or information about the team.
