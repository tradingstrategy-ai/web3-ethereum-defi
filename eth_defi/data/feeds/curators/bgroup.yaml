short_description: Bgroup Finance is an onchain crypto asset manager behind the B100, BBTC, and BGC Enzyme fund family.
long_description: |
  The archived [B100 fund page](https://web.archive.org/web/20241205111741id_/https://bgroup.finance/b100-crypto-index-fund) describes Bgroup Finance as an onchain crypto asset manager, links the B100 Enzyme vault, and identifies its public social profiles. The archived [BBTC page](https://web.archive.org/web/20241205092306id_/https://bgroup.finance/bbtc-crypto-index-fund) and [BGC page](https://web.archive.org/web/20241205104151id_/https://bgroup.finance/bgc-crypto-index-fund) document the related products. The live domain is currently parked, so these references establish the historical public fund identity without claiming that the site is currently active.
