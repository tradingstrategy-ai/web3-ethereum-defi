short_description: Nova Markets operates a perpetuals trading platform, the Arbitrum Conviction Pool and a separate HyperEVM market-making vault.
long_description: |
  [Nova Markets](https://nova.markets/) operates a perpetuals trading platform that combines access to Hyperliquid with its own Conviction Markets. Its [Conviction Pool](https://docs.nova.markets/#/conviction-pool) accepts USDC on Arbitrum and supplies counterparty liquidity to Nova's own markets, earning trading and borrowing fees while bearing trader profit-and-loss risk.

  Nova's [contract disclosures](https://docs.nova.markets/#/contracts) identify the Conviction Pool at 0x9cA80193712F372e2ff33A00127292884F6F8598 as a fork of Gains Network contracts with administration controlled by a Nova 2-of-3 multisig. Pool upgrades have a 14-day timelock, while trading-contract changes can use a three-day route or a ten-hour emergency route; market settings and some oracle changes can be made without a delay.

  Nova also acts as the protocol curator for its separate [NLP vault](https://docs.nova.markets/#/nlp-vault), which uses Lagoon infrastructure on HyperEVM to make markets on Hyperliquid order books. NLP depositors receive a share of trading fees and bear the full market-making profit or loss; key management uses Fordefi MPC and valuations and settlement depend on the operator. Nova describes withdrawals as taking up to seven days; this is an operator estimate rather than an onchain settlement deadline.

  Nova's [risk disclosures](https://docs.nova.markets/risks.md) identify operated keepers and oracles. Its audit references cover upstream Gains contracts, and [Lagoon publishes infrastructure audits](https://docs.lagoon.finance/resources/audits); no Nova-specific deployment audit report or attributable public development repository was verified in the 28 October 2026 review.

# Evidence and background references.
#
# 2026-10-28: Nova's current docs confirm the exact Arbitrum Conviction Pool
# and distinguish it from the Lagoon NLP vault. Both are attributed to the
# Nova protocol curator. Canonical Markdown source URLs retain their specific
# destinations through the feed loader, which strips URL fragments.
# Security review: Arbitrum Safe threshold and timelocks checked onchain;
# HyperEVM owner and valuation manager checked onchain. No Nova-specific audit
# report or official public GitHub development history was verified.
