short_description: Apollo is a global alternative asset manager with private credit strategies.
long_description: |
  [Apollo](https://www.apollo.com/) is a global alternative asset manager. The vault metrics JSON uses ``apollo`` as the curator identity for Ember Apollo ACRED, an Ember vault linked to Apollo credit exposure. [Nest's nACRDX vault](https://app.nest.credit/vaults/nest-acrdx-vault) likewise provides tokenised exposure to Apollo's diversified global credit strategy. This record attributes management of the underlying strategy to Apollo.

  This is intentionally distinct from ``apollo-crypto``, the separate
  Australian crypto-asset fund manager that curates Midas mAPOLLO products.
  The two identities have different official websites and logos.
