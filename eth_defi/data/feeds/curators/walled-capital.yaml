short_description: Walled Capital is the manager label used for the Walled Fund crypto and DeFi portfolio family.
long_description: |
  [Walled Fund's official website](https://walled.fund/) describes a DAO offering onchain liquid investment strategies and links its Enzyme vault family. The [Walled Fund II Enzyme listing](https://app.enzyme.finance/vault/0x952a00d5fa79af70b28fed5725a86d60b17a3297?network=ethereum) describes the product as a continuation of Walled Fund I and links to its Walled Capital strategy paper. The other listings cover ETH options and a liquid digital-asset portfolio, establishing a shared fund family without claiming a separate legal entity.
