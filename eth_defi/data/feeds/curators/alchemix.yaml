short_description: Alchemix is a DeFi protocol for saving, borrowing and earning fixed-yield returns.
long_description: |
  Alchemix describes its protocol as combining saving, borrowing and fixed-yield returns in one application. Its Mix-Yield Tokens represent portfolios of yield strategies selected and rebalanced by the Alchemix DAO. Depositors can use ETH or USDC in those vaults while accessing interest-free borrowing against their deposits.

