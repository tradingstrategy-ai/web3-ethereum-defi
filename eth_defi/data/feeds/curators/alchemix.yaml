feeder-id: alchemix
name: Alchemix
role: curator
lagoon-curator: Alchemix
canonical-feeder-id: alusd
short_description: Alchemix combines yield vaults with borrowing that uses future investment returns to reduce debt.
long_description: |
  [Alchemix](https://alchemix.fi/) introduced self-repaying loans in 2021, allowing users to borrow against
  deposits whose future yield helps repay the debt. Its [Mix-Yield Tokens](https://docs.alchemix.fi/)
  represent shares in portfolios selected and rebalanced by the Alchemix DAO, the protocol's governance
  organisation. ETH and USDC depositors can earn variable returns and borrow synthetic assets against their
  holdings. A separate product, the Transmuter, offers fixed-term redemption of those synthetic assets for the
  underlying tokens.

