short_description: Centaur extracts structured trading signals from public trader posts and operates signal-based public pools on Lighter.
long_description: |
  [Centaur](https://www.centaur.io/) extracts structured trading signals from public trader posts for exchanges, trading agents and automated strategies.

  [Centaur Strategies](https://docs.centaur.io/strategies/lighter-pools/overview) are Centaur-operated public pools on Lighter, each anchored to one public trader. Its extraction pipeline identifies signals, which Centaur interprets, maps to perpetual markets, sizes and risk-manages; a Centaur operator makes every final trade decision under its published [methodology](https://docs.centaur.io/strategies/lighter-pools/methodology). Centaur publishes the reasoning behind its trades rather than replicating the trader's actual portfolio.

  Under its [fee policy](https://docs.centaur.io/strategies/lighter-pools/fees), Centaur does not retain operator fees as revenue: five pools fund random, discretionary rebates for depositors with realised losses, while Black Bull funds purchases and permanent burns of $ANSEM. Rebates are not insurance and do not guarantee recovery of losses or any return. No depositor has a right to a rebate; Centaur can alter, suspend or stop the programme at any time. The tracked traders are unaffiliated with Centaur, do not operate the pools and have not endorsed them, as explained in its [disclosures](https://docs.centaur.io/strategies/lighter-pools/disclosures).

