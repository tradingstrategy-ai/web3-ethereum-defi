short_description: MoneyFi automates stablecoin investments across lending and trading platforms on several blockchains.
long_description: |
  [MoneyFi](https://moneyfi.fund/) develops automated tools for allocating stablecoins across investment platforms on several blockchains. Its [documentation](https://moneyfi-1.gitbook.io/docs) describes comparing opportunities, moving money between them and reinvesting income.

  The [FlowForge strategy](https://app.lagoon.finance/api/vault?chainId=8453&address=0x4efc07dca8697792119484af33549f33ab11bf3c) includes stablecoin pools on Aptos. MoneyFi scores allocations using factors such as returns, risk and the availability of money for withdrawals; the individual platforms and the role of human approval are not disclosed.

# Evidence and background references.
#
# Lagoon's vault page identifies MoneyFi as the curator of the Base MoneyFi
# FlowForge Vault. MoneyFi's official homepage and documentation describe its
# automated, cross-chain stablecoin strategy platform.
