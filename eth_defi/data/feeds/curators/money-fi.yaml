short_description: MoneyFi is a DeFAI platform that automates stablecoin yield strategies across protocols and blockchains.
long_description: |
  MoneyFi provides AI-driven, automated strategies for users to deploy stablecoins across DeFi protocols and blockchains. Its platform describes automated yield scanning, compounding, allocation, and cross-chain management, while its documentation presents the product as a simplified stablecoin monetisation service. Lagoon Finance lists MoneyFi as the curator of the MoneyFi FlowForge Vault on Base.

