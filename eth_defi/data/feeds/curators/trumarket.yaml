long_description: |
  TruMarket provides agricultural trade financing through a blockchain-enabled platform with investor reporting, deal traceability and risk-management tooling.
  Its official website describes capital being deployed to agricultural trade deals through USDC or wire transfers, with deal documentation and milestone tracking.
  Lagoon Finance identifies TruMarket as the curator of its Base USDC vault, which provides onchain access to the company's agricultural trade financing strategy.

