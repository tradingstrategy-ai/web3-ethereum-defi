short_description: TruMarket finances agricultural shipments from Latin American exporters to buyers in Europe, the US, Asia and the UAE.
long_description: |
  [TruMarket](https://www.trumarket.tech/) finances agricultural shipments, providing money when goods leave the exporter and receiving repayment after delivery. Its [vault mandate](https://app.lagoon.finance/api/vault?chainId=8453&address=0xbe7db44f4ce20dac83b578b94fd35087f66e9754) covers trade connecting exporters in Latin America, including Peru and Chile, with buyers in Europe, the US, Asia and the UAE.

  TruMarket selects and structures the deals, checks trade documents and monitors shipments and repayments. Borrowers' payments fund investor income; delayed shipments or unpaid invoices can delay repayment or cause losses.

# Evidence and background references.
#
# Lagoon's detailed API record identifies TruMarket as the curator of the
# Base TruMarket vault. TruMarket's official website describes its
# blockchain-enabled agricultural trade financing platform and its use of
# documented agricultural trade deals.
