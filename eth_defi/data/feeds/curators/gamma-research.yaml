    title: apxUSD exposure caused USDC vault drawdowns
    description: |
      [Upshift reported](https://x.com/upshift_fi/status/2085463558385463777) that Upshift Gamma USDC held apxUSD, a synthetic dollar issued by Apyx Finance and backed primarily by dividend-bearing preferred shares, notably Strategy's STRC. According to the [first-party update](https://x.com/upshift_fi/status/2085463558385463777), STRC traded well below its $100 par value and apxUSD fell below its intended value. [Upshift said](https://x.com/upshift_fi/status/2085463558385463777) that marking down the position caused a 12.8% drawdown in Upshift Gamma USDC and an 8% drawdown in Upshift Core USDC, which held a position in the Gamma vault. The [update stated](https://x.com/upshift_fi/status/2085463558385463777) that the drawdowns were reflected in vault share prices and all other positions were unaffected and performing as expected.
    incident_kind: significant_loss
    severity: significant_loss
