long_description: |
  Gamma Research describes its work as risk management and strategy curation for DeFi and CeFi vaults, with quantitative strategies across several blockchain ecosystems.
  Upshift names Gamma Research as the strategist for its Gamma vaults, including its Ethereum USDC vault, which uses market-neutral and cross-chain strategies intended to prioritise capital protection and risk-adjusted yield.
