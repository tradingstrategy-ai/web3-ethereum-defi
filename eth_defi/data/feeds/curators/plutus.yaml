short_description: Plutus runs automated DeFi investment vaults and develops products for protocol governance.
long_description: |
  [Plutus](https://plutus.fi/) is a community-governed DeFi platform whose vaults automate investment
  strategies and reinvest earnings. Its [plvHEDGE vault](https://docs.plutus.fi/products/plvassets) began with
  funding-rate arbitrage and later expanded to multiple strategies; plvDOLO runs an automated strategy within
  the Dolomite lending protocol. Investors can exit through liquidity pools or request redemption through a
  queue. Queued redemptions can take up to seven days, while selling through a pool depends on available
  liquidity and can incur slippage.
