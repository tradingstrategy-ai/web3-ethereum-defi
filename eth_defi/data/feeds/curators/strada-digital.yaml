short_description: Strada Digital manages a digital asset lending strategy for professional and sophisticated investors.
long_description: |
  [Strada Digital](https://www.strada-digital.com/) manages the Strada Yield Fund, which makes loans in
  digital asset markets. Founded by portfolio manager Tobias van Amstel, the fund considers short- and
  long-term debt, senior and junior claims, and loans with additional equity participation. It accepts USDC
  and USDT, with monthly subscriptions and redemptions for eligible investors. Its [Strada USDC vault on
  Lagoon](https://app.lagoon.finance/vault/1/0xcb58582b0d52ce5feecb06ba9ce66598b0d57886) is presented as a
  public record of the firm's performance.
