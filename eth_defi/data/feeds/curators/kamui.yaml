short_description: Kamui operates institutional vault products for tokenised real-world assets.
long_description: |
  [Kamui](https://www.kamui.finance/) operates infrastructure and managed vault products for tokenised real-world assets. Its [launch announcement](https://www.linkedin.com/posts/kamui-finance_kamui-finance-brings-three-institutional-activity-7508163602609209344-rxYM) identifies Stable, Balanced and Boosted as its first three permissioned Ethereum vaults, with mandates spanning tokenised US Treasury and money-market instruments, diversified assets and private credit. Access is available to professional and sophisticated investors in eligible jurisdictions.

# Evidence and background references.
#
# Kamui's official website describes its end-to-end vault operations and the
# three Kamui RWA Earn mandates. The official launch post identifies Stable,
# Balanced and Boosted as Kamui's first three whitelisted Ethereum RWA vaults.
