short_description: Birch Hill assesses loans backed by real-world assets and manages onchain lending products.
long_description: |
  [Birch Hill](https://birchhill.io/) is a New York-based financial services firm that assesses loans
  backed by real-world assets and manages onchain lending products. Its work includes reviewing borrowers,
  selecting the assets accepted as loan security and setting lending limits.

  Its [Groma Ecosystem vault](https://tradingstrategy.ai/vaults/birch-hill-rwa-usdc) lends USDC
  against GRO, tokenised shares in GromaREIT's residential property portfolio, and earns interest from
  borrowers. Its separate [RWA USDC Flagship](https://tradingstrategy.ai/vaults/birch-hill-rwa-usdc-2)
  allocates to Ecosystem vaults for verified accredited and institutional investors.

  The restricted RWA USDC product [launched in July 2026](https://research.birchhill.io/p/birch-hills-first-onchain-product)
  using Yearn vault infrastructure and Morpho lending. In October 2026, Birch Hill
  [raised a $4 million seed round led by Multicoin Capital](https://www.businesswire.com/news/home/20261028277814/en/Birch-Hill-Raises-%244-Million-Seed-Round-Led-by-Multicoin-Capital-to-Bring-U.S.-Credit-Onchain),
  with ParaFi Capital, Castle Island Ventures and Nascent participating, bringing total company financing to $6.5 million.
