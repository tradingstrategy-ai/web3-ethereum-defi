short_description: Birch Hill specialises in onchain credit backed by real-world assets, starting with tokenised property equity.
long_description: |
  [Birch Hill](https://birchhill.io/) applies credit underwriting to loans backed by tokenised real-world
  assets. Its [first product, launched in July
  2026](https://research.birchhill.io/p/birch-hills-first-onchain-product), lends USDC on Base against GRO
  tokens representing shares in GromaREIT, a private real estate investment trust focused on residential
  property in the northeastern United States. The vault combines Morpho lending markets with Yearn vault
  infrastructure. Both lenders and borrowers must pass identity and accredited-investor checks; Birch Hill
  publishes the strategy's underwriting and risk documentation.
