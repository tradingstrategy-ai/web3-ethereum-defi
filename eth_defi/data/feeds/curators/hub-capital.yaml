short_description: Hub Capital is the asset manager for a USDC vault on Lagoon Finance.
long_description: |
  Lagoon Finance identifies Hub Capital as the asset manager of the Hub Capital USDC vault on Ethereum. The vault describes a strategy that uses blue-chip protocols, strategies, and tokens in pursuit of liquid USDC yield, without points or other illiquid rewards.

# Evidence and background references.
#
# Lagoon's curator API identifies Hub Capital as a curator and publishes its
# curator logo. Its Hub Capital USDC vault page identifies Hub Capital as the
# asset manager and describes the vault strategy.
