short_description: Almanak builds software for researching, testing and running automated investment strategies.
long_description: |
  [Almanak](https://almanak.co/) provides tools for building and testing investment strategies across lending,
  liquidity provision and derivatives. Developers can use AI assistants to write strategy code and simulate
  trades before committing funds. Its [Autonomous Liquidity USD
  vault](https://app.lagoon.finance/vault/1/0xdcd0f5ab30856f28385f641580bbd85f88349124) reallocates USDC
  between DeFi opportunities when the expected improvement in yield justifies transaction costs. AI tools
  helped develop this vault's strategy; deployed code governs its trading decisions.
