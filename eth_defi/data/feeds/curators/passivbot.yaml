short_description: PassivBot is an open-source trading bot project for automated cryptocurrency futures strategies.
long_description: |
  [PassivBot](https://github.com/enarjord/passivbot) is an open-source project that provides software for automated cryptocurrency futures trading. Its contrarian approach manages buy and sell orders around price moves, aiming to buy dips and take profit on rebounds.

  A built-in backtester and optimiser help users compare trading configurations against past prices. The project identifies [Passivbot Canon](https://tradingstrategy.ai/vaults/passivbot-canon) as its live reference vault running a long-only configuration on Hyperliquid.

  #### Further reading

  - [Official strategy documentation](https://github.com/enarjord/passivbot/blob/master/docs/config.bot.md)
  - [CoinLedger: The best open source crypto trading bots](https://coinledger.io/tools/the-best-open-source-and-free-crypto-trading-bots)
  - [Futuresboard: Passivbot guide — historical community guidance](https://ecoppen.github.io/futuresboard/passivbot/)

