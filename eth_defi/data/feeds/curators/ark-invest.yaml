short_description: ARK Invest is an investment manager focused on disruptive innovation across public and private markets.
long_description: |
  [ARK Invest](https://www.ark-invest.com/) (ARK Investment Management LLC) is an SEC-registered investment adviser. It manages exchange-traded funds and other investment products focused on disruptive innovation, including artificial intelligence, robotics, energy storage, genomics and blockchain technology.

  ARK manages the [ARK Venture Fund](https://www.ark-funds.com/funds/arkvx), a registered closed-end interval fund investing in private and public companies. In September 2026, ARK and Securitize [announced a tokenised share class of the fund](https://www.prnewswire.com/news-releases/ark-invest-tokenizes-ark-venture-fund-arkvx-with-securitize-302888300.html) on Ethereum, with Securitize providing the tokenisation and investor-onboarding infrastructure while ARK manages the underlying fund.
