long_description: |
  [NuWealth](https://nuwealth.io/) offers curated DeFi lending vaults powered by Morpho. [Bake's lending announcement](https://blog.bake.io/bake-lending-gets-a-defi-upgrade-risk-managed-vaults-powered-by-nuwealth/) identifies NuWealth as an independent third-party risk manager that allocates vault deposits and monitors lending risk parameters. NuWealth at nuwealth.io is separate from [NuWealth.ai](https://nuwealth.ai/check), which operates Agent RockSteady on Hyperliquid.
