short_description: 722 Capital manages lending and trading portfolios and company treasury investments in crypto markets.
long_description: |
  [722 Capital](https://722.capital/) manages portfolios that earn income from lending, trading and providing money for token exchanges. Its investment venues include [Morpho](https://morpho.org/) for lending and [Pendle](https://pendle.finance/) for trading rights to future yield.

  The firm also manages company reserves and tailored portfolios for family offices and institutional investors. These services have separate investment mandates; the firm's general approach does not establish the holdings of each vault.

