short_description: 722 Capital manages DeFi yield strategies and treasury portfolios for investors, protocols and institutions.
long_description: |
  [722 Capital](https://722.capital/) manages vaults that allocate across DeFi lending, liquidity and yield
  markets, including Morpho and Pendle. It also offers treasury management and private mandates for family
  offices and institutional investors. Its vaults use Lagoon and Safe infrastructure, with portfolio values
  published onchain and fees defined in the vault contracts. The firm's name refers to 22 July 2014, the date
  of Ethereum's token sale.

# Evidence and background references.
#
# Lagoon's own vault API identifies 722 Capital as the curator for the
# 722Capital-USDC vault on Base. The official 722 Capital website describes
# the firm as building institutional-grade DeFi yield strategies.
