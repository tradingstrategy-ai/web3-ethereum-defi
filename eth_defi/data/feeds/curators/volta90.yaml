long_description: |
  [VOLTA90](https://volta90.trade/) manages positions on [Hyperliquid](https://hyperliquid.xyz/) that track equities, commodities, indices and crypto markets. Human operators select and approve positions, supported by automated screening, execution and risk controls. The strategy can take positions larger than its capital, with total market exposure capped at twice the portfolio value; adverse moves can force positions to close.

  Access is invite-only. Its [migration announcement](https://volta90.trade/blog/volta90-ethereum-migration) identifies its current Ethereum vault and former Arbitrum vault, which closed in September 2026.
