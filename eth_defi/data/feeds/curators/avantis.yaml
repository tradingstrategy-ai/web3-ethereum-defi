# Avantis operates its own unified avUSDC liquidity pool on Base.
# Feed collection and logos are shared with protocols/avantis.yaml.
feeder-id: avantis
name: Avantis
role: curator
canonical-feeder-id: avantis
short_description: Avantis operates a trading platform and its shared USDC pool on Base.
long_description: |
  [Avantis](https://www.veranta.xyz/), [now branded Veranta](https://github.com/Avantis-Labs/avantis_trader_sdk/blob/main/README.md), operates a trading
  platform on Base and its shared USDC pool.
  **No separate third-party curator is disclosed** for the pool.

  Depositors in the [avUSDC vault](https://docs.veranta.xyz/liquidity-providers/veranta-lp-vault-avusdc)
  supply USDC to back trading positions and earn a share of trading fees. Trader profits
  draw on a reserve built from trader losses before using depositors' money,
  and withdrawals depend on money being available in the pool.
