short_description: D2 Finance manages onchain investment vaults specialising in derivatives and hedging strategies.
long_description: |
  [D2 Finance](https://d2.finance/) is an investment manager focused on derivatives strategies executed
  onchain. Its approach includes volatility arbitrage, relative-value trading, dynamic hedging and positions
  taken around market events. Investors access these strategies through tokenised vaults, with onchain
  accounting for their holdings. The platform places limits on which actions its traders can take and requires
  multiple approvals for critical operations.
