long_description: |
  [Bitwise](https://bitwiseinvestments.com) is a crypto asset manager offering investment products and onchain strategies. Its [Onchain Solutions vault page](https://onchain.bitwiseinvestments.com/vaults/papy-ausd) identifies Bitwise Investment Manager, LLC as the provider of vault curation services for its Morpho strategies. Bitwise's [Arc announcement](https://bitwiseinvestments.com/newsroom/the-bitwise-premium-rwa-vault-papy-expands-to-arc-with-usdc-deposits) documents its Bitwise Premium RWA vault on Arc.

