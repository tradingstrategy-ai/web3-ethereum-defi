long_description: |
  Zharta provides programmable, compliant lending infrastructure for fixed-rate loans against tokenised real-world and digital assets. Its website describes borrower and lender workflows with custom terms, smart-contract settlement, and API-enabled automation. Lagoon Finance lists Zharta Finance as the curator of its Ethereum Zharta RWA Prime USDC vault.

