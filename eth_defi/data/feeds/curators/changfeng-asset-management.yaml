short_description: Changfeng Asset Management is a Hong Kong licensed asset manager providing investment-advisory and asset-management services.
long_description: |
  Changfeng Asset Management is a Hong Kong licensed corporation authorised for Type 4 (advising on securities) and Type 9 (asset management) regulated activities.
  Asseto's public registry identifies Changfeng Asset Management Limited as investment advisor for CFSRS and investment manager for CFSAI tokenised fund products.

