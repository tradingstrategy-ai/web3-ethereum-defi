short_description: Hyperithm is an asset manager based in Tokyo and Seoul that uses automated trading models to seek profits from price differences across markets.
long_description: |
  [Hyperithm](https://www.hyperithm.com/) manages assets for institutions and wealthy individuals from Tokyo and Seoul. Founded in 2018, it uses automated trading models to seek profits from price differences across centralised exchanges and onchain markets, aiming to limit dependence on rising or falling prices.

  The firm also invests in companies connected to its asset-management business. Its lending products include Saturn USDC on Monad, which allocates deposits to [Morpho](https://morpho.org/) lending markets.
