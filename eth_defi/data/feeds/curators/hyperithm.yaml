short_description: Hyperithm is a Tokyo- and Seoul-based asset manager specialising in systematic trading and arbitrage.
long_description: |
  [Hyperithm](https://www.hyperithm.com/) was founded in 2018 and serves institutions and high-net-worth
  investors from Tokyo and Seoul. It uses algorithmic trading and arbitrage across centralised exchanges and
  onchain markets, aiming to earn returns with limited dependence on market direction. The firm also makes
  venture investments related to its asset-management business. Its onchain products include Morpho lending
  vaults such as [Saturn USDC on
  Monad](https://app.morpho.org/monad/vault/0x75753e494e5e374c52e1d84fc04eb14b10f2c079).
