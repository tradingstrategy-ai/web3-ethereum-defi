short_description: Neutral Trade runs onchain vaults in which vetted trading firms trade depositors' money, many with strategies designed to limit exposure to market direction.
long_description: |
  [Neutral Trade](https://www.neutral.trade/) runs a marketplace of trading vaults on Solana. Each vault holds depositors' money, and a trading firm, usually an outside one, runs its strategy, such as arbitrage, market making or options trading. Its [September and October 2026 update](https://www.neutral.trade/blog/september-october-2026-update) says these firms can open and close positions but cannot withdraw deposits, and that money used for trading on centralised exchanges stays with the custodians Ceffu or Copper.

  Its main product, Neutral Autopilot, spreads one deposit across several of these strategies. Neutral Trade offers Autopilot to Ethereum and Monad users through vaults built with [Accountable](https://yield.accountable.capital/), which pass deposits into the Solana Autopilot vault.

  Neutral Trade was founded in 2024. Its [FAQ](https://www.neutral.trade/faq) names Solana Labs, YZi Labs, DRW Labs, Skyland Ventures, BlackPine and Monke Ventures as investors in the company; they do not guarantee vault returns.

