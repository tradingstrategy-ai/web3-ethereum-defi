short_description: Neutral Trade offers vaults that put deposits into trading strategies and lending markets, with different levels of review for each product range.
long_description: |
  [Neutral Trade](https://www.neutral.trade/) offers vaults where trading firms use depositors' money to trade price differences, place buy and sell orders, or take positions on expected market moves. For its Curated and Marketplace strategies, [custody arrangements](https://www.neutral.trade/blog/september-october-2026-update) give firms permission to trade but not withdraw deposits; centralised exchange strategies use [Ceffu](https://www.ceffu.com/) or [Copper](https://copper.co/) to hold assets outside the exchange. Voltr vaults listed alongside them have different terms: their curators control the funds.

  Neutral Autopilot spreads deposits across several strategies, while NT Earn moves money between [Kamino](https://kamino.com/) and [Jupiter Lend](https://jup.ag/lend) to earn borrower interest. [Accountable](https://yield.accountable.capital/) provides vaults that pass deposits from Ethereum and Monad into the Solana Autopilot vault.

  The company was [founded in 2024](https://www.neutral.trade/faq), with investors including Solana Labs, YZi Labs, DRW Labs, Skyland Ventures, BlackPine and Monke Ventures. These are investors in the company, not guarantors of vault returns.

