short_description: Vision Research builds automated crypto trading systems that predict short-term price moves and place buy and sell orders.
long_description: |
  Vision Research runs [automated trading models](https://docs.neutral.trade/for-capital-allocators/usdc-yield/market-neutral/hft-multi-factor) on [Binance](https://www.binance.com/). They combine predictions of continuing trends or price reversals with [market making](https://tradingstrategy.ai/glossary/market-making), offering buy and sell prices to earn the gap between them and exchange rebates.

  The team develops trading models and the software that executes them for centralised and onchain markets. **Vision Research is a published alias**, and the firm's legal name is not disclosed.
