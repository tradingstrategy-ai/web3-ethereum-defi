short_description: σ-Labs researches crypto investment risks and strategies that operate across blockchains.
long_description: |
  [σ-Labs](https://www.sigmalabs.fi/) researches investment risks and systems that operate across blockchains. It [co-curates an ether strategy with Ellen Capital](https://app.lagoon.finance/api/vault?chainId=1&address=0x2746f31096f23670caf4043f8b30d8d02405a257) that buys staked ether tokens below their redemption value and exchanges them for ether.

  The organisations also co-curate [stablecoin lending across several blockchains](https://app.lagoon.finance/api/vault?chainId=1&address=0xf02030ab0d7385ce4cc2f7f64b7b44430fb44c89) through [Morpho](https://morpho.org/). The precise division of responsibilities between the two curators is not disclosed.

# Evidence and background references.
#
# Sigma Labs' official homepage describes its onchain research work. Lagoon's
# official curator and vault APIs identify σ-Labs as a curator and show that it
# co-curates the two named Ethereum vaults with Ellen Capital.
