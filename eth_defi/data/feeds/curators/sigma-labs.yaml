short_description: σ-Labs designs automated strategies for lending stablecoins and trading ether and crypto futures.
long_description: |
  [σ-Labs](https://www.sigmalabs.fi/) designs the trading rules for two vaults it runs with Ellen Capital. One [buys discounted staked ether](https://www.sigmalabs.fi/papers/lagoon-governance.pdf) and redeems it for ether. The other [lends USDC across blockchains](https://tradingstrategy.ai/vaults/cross-chain-usdc-lending), moving funds when the extra interest is expected to cover the cost.

  Its [other strategies](https://www.sigmalabs.fi/products) include fixed-rate lending against bitcoin-backed tokens, trading perpetual futures and borrowing ether to buy more staked ether. Its sigmaETH vault lends wrapped ether while the redemption strategy waits for a trade.

  For [Stablecoin Market Making](https://tradingstrategy.ai/vaults/stablecoin-market-making), Lobster designs the trading rules and Coral Capital runs them on [Uniswap](https://app.uniswap.org/). σ-Labs [values the positions and settles deposits and withdrawals](https://www.sigmalabs.fi/papers/stablecoin-market-making-governance.pdf).

