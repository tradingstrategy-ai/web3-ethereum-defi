long_description: '[Presto](https://www.prestolabs.io/) is a quantitative trading firm established in 2014. Its
  Morpho USDC Prime vault lends against blue-chip collateral, while USDC Forte targets selected real-world asset
  collateral through its partnership with 3F. The firm describes collateral review, liquidation participation and
  active allocation in its [curator launch announcement](https://www.linkedin.com/posts/presto-official_were-proud-to-announce-that-presto-is-now-activity-7488515573493190656-QRRJ).'
