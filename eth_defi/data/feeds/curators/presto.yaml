short_description: Presto is a quantitative trading firm that builds automated trading systems and manages DeFi lending vaults.
long_description: |
  [Presto](https://www.prestolabs.io/) was founded in 2014 and works in high-frequency trading, market making
  and portfolio management. It builds its own trading systems and market simulators to research and execute
  strategies. Its [Morpho lending
  business](https://www.linkedin.com/posts/presto-official_were-proud-to-announce-that-presto-is-now-activity-7488515573493190656-QRRJ)
  includes USDC Prime, which lends against established crypto assets, and USDC Forte, which targets tokenised
  real-world collateral in partnership with 3F. Presto's role includes reviewing collateral, allocating
  deposits and participating in liquidations when borrowers' collateral must be sold.
