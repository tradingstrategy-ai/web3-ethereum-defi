short_description: Rho Labs builds markets and payment infrastructure for institutions trading financial contracts on blockchains.
long_description: |
  [Rho Labs](https://rho.trading/) builds markets for interest rates, contracts tracking asset prices and blockchain representations of real-world assets. Its Rho X platform brings trading and the transfer of payments between counterparties into one system.

  Its [managed vaults](https://rho.trading/vaults) can enforce identity checks, country restrictions and investment limits. The [liquidity provider strategy](https://app.lagoon.finance/api/vault?chainId=1&address=0x4cb280e63251b9ab24a54def74bf5995d82ff398) supplies trading capital across Rho products and aims to earn fees and differences between buying and selling prices.

# Evidence and background references.
#
