short_description: Tori Finance issues trUSD, a token designed to track one US dollar, and operates its strUSD staking product.
long_description: |
  [Tori Finance](https://tori.finance/) issues trUSD, a token designed to track one US dollar, and
  operates its [native strUSD staking vault](https://docs.tori.finance/products/strusd).
  Rewards come from money-market positions and trades that seek pricing differences
  while offsetting market exposure. This is a protocol-operated product; RockawayX
  curates the separate [Tori ecosystem vault](https://docs.tori.finance/resources/pre-deposit)
  built using Upshift.
