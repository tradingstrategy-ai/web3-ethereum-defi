long_description: |
  [Niska Capital's company profile](https://www.linkedin.com/company/niskacapital) describes crypto investing and digital-asset management. The [Ethereum Fund I listing](https://app.enzyme.finance/vault/0x308b02c6a4e346f1f6fb5c7d79d0de2c4f3abb82?network=ethereum) and [Polygon Fund I listing](https://app.enzyme.finance/vault/0xe113eee61b9cda3ec99b02645d361d8d0aa08a63?network=polygon) describe long-term holdings, momentum investments, and interaction with the DeFi ecosystem. The listings identify Niska's founders in their manager copy; this record uses the public Niska Capital brand rather than inferring a separate legal entity.
