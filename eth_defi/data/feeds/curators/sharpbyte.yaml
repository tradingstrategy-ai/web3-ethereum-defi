long_description: |
  [SharpByte Capital](https://www.sharpbyte.xyz/) is an investment fund led by general partner Marco Manoppo.
  It combines trading strategies designed to limit exposure to broad market moves with DeFi yield allocation
  and liquidity deals negotiated before a project's token launch. Its advisory work includes vault design and
  access to private markets. SharpByte manages products on Upshift and Morpho, including [SharpByte USDC High
  Yield on Monad](https://app.morpho.org/monad/vault/0xf57e9898575fab80b0f2acde5443276bec8c542d).
