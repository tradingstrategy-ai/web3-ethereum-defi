long_description: |
  Monarq Asset Management describes itself as a multi-strategy investment firm focused on digital-asset markets. Its official website highlights quantitative strategies and options trading, combining traditional risk discipline with crypto-native expertise. The firm was formerly known as MNNC Group, which is retained as an Upshift strategist alias for historical vault metadata.
