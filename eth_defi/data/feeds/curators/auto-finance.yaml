long_description: '[AUTO Finance](https://auto.finance/), formerly Tokemak, develops and operates autopools. Its
  [protocol mechanics](https://docs.auto.finance/auto-pools-protocol/protocol-mechanics) describe automatic allocation
  and rebalancing across eligible DeFi destinations. Users supply assets to an autopool whose rules determine eligible
  allocation destinations and rebalancing.'
