short_description: AUTO Finance develops autopools for automated DeFi asset allocation.
long_description: '[AUTO Finance](https://auto.finance/) develops autopools for automated asset allocation. Its
  [protocol mechanics](https://docs.auto.finance/auto-pools-protocol/protocol-mechanics) describe automatic allocation
  and rebalancing across eligible DeFi destinations. Users supply assets to an autopool whose rules determine eligible
  allocation destinations and rebalancing. The protocol documentation does not name a separate curator for native autopools.'
