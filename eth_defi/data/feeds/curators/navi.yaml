short_description: NAVI Protocol develops lending and borrowing markets and curates crypto yield vaults.
long_description: |
  [NAVI Protocol](https://naviprotocol.io/) develops [lending and borrowing markets on Sui](https://docs.naviprotocol.io/), where depositors earn interest from borrowers who pledge assets as security. Its [Ethereum vault offering](https://app.lagoon.finance/api/vault?chainId=1&address=0x47491305479635357df29fe0cb6f1af10e51d4da) aims to earn Sui ecosystem yield without requiring users to bridge assets or use a Sui wallet. The allocation mechanism for that product is not disclosed.
