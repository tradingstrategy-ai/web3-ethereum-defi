short_description: Gami manages DeFi vaults across lending, exchange liquidity and structured yield markets.
long_description: |
  [Gami](https://gamilabs.io/) selects and rebalances investments across a restricted set of DeFi protocols.
  These include Aave, Morpho and Silo for lending, Curve for exchange liquidity, and Pendle and Spectra for
  trading future yield. It also uses governance positions to direct protocol reward distributions towards its
  strategies. Lagoon lists Gami alongside My Seed Advisor for the [Portefeuille Dynamique
  vault](https://app.lagoon.finance/vault/8453/0xf56bfe07b8d6e6d74258cdb6969a633629b06b08), which combines
  crypto asset selection with DeFi yield strategies.
