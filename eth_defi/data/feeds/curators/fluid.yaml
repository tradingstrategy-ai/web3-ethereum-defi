short_description: Fluid operates lending markets and protocol-managed yield vaults.
long_description: '[Fluid](https://fluid.io/) is a lending and liquidity protocol developed by the Instadapp team.
  Its [lending architecture](https://docs.fluid.instadapp.io/%2F) gives depositors access to the shared liquidity
  layer through fTokens. Native lending and Lite vaults are protocol-operated; independent wrappers can have their
  own operators.'
