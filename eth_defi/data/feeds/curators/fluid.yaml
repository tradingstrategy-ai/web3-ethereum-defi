short_description: Fluid combines lending and decentralised trading through a shared pool of liquidity.
long_description: |
  [Fluid](https://fluid.io/), developed by the Instadapp team, combines lending, borrowing and decentralised
  trading. Its [lending pools](https://docs.fluid.instadapp.io/) let users supply assets such as USDC and earn
  interest, receiving fTokens that represent their deposits and accrued returns. These pools draw on a shared
  liquidity layer used by Fluid's lending and trading products. Native Fluid products are operated by the
  protocol; products built on top of Fluid by other organisations can have separate managers.
