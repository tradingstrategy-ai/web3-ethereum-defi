short_description: 40acres operates cashflow lending pools backed by revenue-generating digital assets.
long_description: '[40acres](https://www.40acres.finance/) operates USDC supply pools that fund loans against revenue-generating
  assets such as vote-escrowed NFTs. Its [contract catalogue](https://docs.40acres.finance/contracts)
  lists the supply vaults and linked loan contracts. Its [lending documentation](https://docs.40acres.finance/lending) explains how deposits fund loans and receive borrower rewards.'
