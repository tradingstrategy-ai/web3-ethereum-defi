short_description: 40acres funds loans against income-generating crypto assets and distributes collateral rewards to USDC lenders.
long_description: |
  [40acres](https://www.40acres.finance/) lets USDC depositors fund loans secured by income-generating crypto
  assets. These include vote-escrowed NFTs, which represent locked exchange tokens with voting rights and
  rewards. Its [lending model](https://docs.40acres.finance/lending) collects rewards from borrowers'
  collateral and distributes them to lenders, linking returns to exchange trading fees and payments for
  directing liquidity. The protocol operates pools associated with Aerodrome, Pharaoh and Blackhole;
  withdrawals depend on available pool liquidity.
