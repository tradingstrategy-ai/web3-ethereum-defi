long_description: |
  [Dialectic](https://dialectic.com) combines machine intelligence with crypto-native primitives to build financial strategies. In its [Morpho vault announcement](https://forum.morpho.org/t/introducing-dialectic-meccanico-by-dialectic-vaults-on-morpho/2334), Dialectic describes its curation practice as applying the same structured-credit, real-world-asset and DeFi risk processes it uses for its own investment work. The announcement identifies Dialectic Meccanico as a Dialectic-curated Morpho vault family.

