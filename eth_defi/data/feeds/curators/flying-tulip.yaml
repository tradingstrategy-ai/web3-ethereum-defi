# Flying Tulip curator - feeds provided by protocols/flying-tulip.yaml
#
# Alias rationale:
# - The reviewed sftUSD and ssftUSD positions are protocol-managed: Flying Tulip collects
#   strategy yield and protocol fee revenue through its treasury, then can
#   distribute FT to sftUSD stakers or compound ftUSD for ssftUSD holders.
# - Flying Tulip already has canonical protocol feed metadata, so this alias
#   reuses those sources and avoids duplicate feed collection.
#
# Description and curator evidence:
# - https://docs.flyingtulip.com/product-suite/ft-usd/
# - https://api.flyingtulip.com/ftusd/contracts/all
feeder-id: flying-tulip
name: Flying Tulip
role: curator
canonical-feeder-id: flying-tulip
short_description: Flying Tulip manages ftUSD's backing strategies and distributes income as FT token rewards for sftUSD holders or reinvested ftUSD rewards for ssftUSD holders.
long_description: |
  [Flying Tulip](https://flyingtulip.com/ftusd/) manages the money backing ftUSD,
  its token designed to track the US dollar, and the sftUSD and ssftUSD staking
  vaults. Its [product documentation](https://docs.flyingtulip.com/product-suite/ft-usd/)
  describes stablecoin lending and savings through Aave and Spark, and lists
  staking strategies that use borrowing to offset cryptocurrency price movements.
  The [June 2026 update](https://blog.flyingtulip.com/flying-tulip-june-update/)
  reported deploying the latter approach on Ethereum and Sonic. The documentation
  describes available strategies rather than current allocations on every network.
  The treasury collects strategy income and protocol revenue and decides how
  much to distribute to holders.

  sftUSD holders claim rewards in FT, Flying Tulip's token. ssftUSD holders
  have their ftUSD rewards automatically reinvested. The product documentation
  linked above states that ssftUSD receives a slightly smaller reward allocation.
  The [September 2026 update](https://blog.flyingtulip.com/flying-tulip-september-update/)
  explains its launch.

  Rising borrowing costs or losses on backing assets can reduce income and
  put pressure on ftUSD's dollar target. sftUSD rewards also depend on FT's
  market price. Withdrawal rate limits can delay sftUSD exits; an ssftUSD
  withdrawal fails without creating a queued claim if it cannot be paid immediately.
