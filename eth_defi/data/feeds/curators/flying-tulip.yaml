# Flying Tulip curator - feeds provided by protocols/flying-tulip.yaml
#
# Alias rationale:
# - The reviewed sftUSD and ssftUSD positions are protocol-managed: Flying Tulip collects
#   strategy yield and protocol fee revenue through its treasury, then can
#   distribute FT to sftUSD stakers or compound ftUSD for ssftUSD holders.
# - Flying Tulip already has canonical protocol feed metadata, so this alias
#   reuses those sources and avoids duplicate feed collection.
#
# Description and curator evidence:
# - https://docs.flyingtulip.com/product-suite/ft-usd/
# - https://api.flyingtulip.com/ftusd/contracts/all
feeder-id: flying-tulip
name: Flying Tulip
role: curator
canonical-feeder-id: flying-tulip
short_description: Flying Tulip operates ftUSD and the protocol-managed sftUSD and ssftUSD staking positions.
long_description: |
  [Flying Tulip](https://flyingtulip.com/ftusd/) operates ftUSD and the optional
  sftUSD and ssftUSD staking positions reviewed here. Its [ftUSD documentation](https://docs.flyingtulip.com/product-suite/ft-usd/)
  states that net strategy yield and protocol fee revenue are collected by the
  treasury, then can be distributed to sftUSD stakers as separately claimable
  FT or compounded as ftUSD for ssftUSD holders. The [September launch update](https://blog.flyingtulip.com/flying-tulip-september-update/)
  explains the auto-compounding variant and its lower yield allocation.
  This makes Flying Tulip the protocol-managed curator for these positions,
  rather than an independent third-party manager. Users remain exposed to the
  stablecoin, strategy and liquidity risks. sftUSD also carries FT-price and
  possible queued-redemption exposure; ssftUSD withdrawals revert when they
  cannot settle immediately. These considerations are
  described in the product documentation.
