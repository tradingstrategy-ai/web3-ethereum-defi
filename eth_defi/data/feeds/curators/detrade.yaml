short_description: DeTrade manages USD, euro and ETH yield strategies through its Core vaults.
long_description: |
  [DeTrade](https://detrade.fund/) presents three Core vaults on Base with USD, euro and ETH investment mandates. Its strategies fund token exchanges, hold assets that earn interest or staking rewards, use [Pendle](https://pendle.finance/) to trade rights to future income, and collect incentive tokens. Some Core strategies borrow money to increase their investments, adding financing costs and the risk of forced sales when pledged assets lose value.

  Some USDC lending portfolios retain DeTrade branding but appear in [Murmurr's current product book](https://murmurr.xyz/); a company-wide rebrand or management-handover date is not disclosed.
