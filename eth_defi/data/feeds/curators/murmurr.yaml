short_description: Murmurr manages stablecoin lending portfolios on Morpho.
long_description: |
  [Murmurr](https://murmurr.xyz/) manages stablecoin lending portfolios on [Morpho](https://morpho.org/), where borrowers pay interest on loans secured by assets that can be sold if borrowers fail to repay. Its portfolios compare expected interest with the risk of borrowers failing to repay, and limit how much can be invested against particular assets or in markets with little money available for withdrawals. Some portfolios retain older DeTrade branding; a handover date is not disclosed in the published product information.
