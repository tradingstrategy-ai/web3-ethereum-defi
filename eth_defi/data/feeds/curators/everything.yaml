short_description: Everything is an EVM liquidity layer for trading, lending, borrowing, and leverage.
long_description: |
  Everything describes itself as a deterministic, oracleless, decentralised liquidity layer for humans and AI agents. Its platform combines trading, lending, borrowing, and leverage through a single liquidity pool, and presents market-neutral and arbitrage yield strategies in its Earn products. Lagoon Finance lists Everything as curator of three Ethereum funding-arbitrage vaults.

