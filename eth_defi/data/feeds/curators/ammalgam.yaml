short_description: Ammalgam is a decentralised lending exchange for lending, trading and leveraging assets without oracles.
long_description: |
  Ammalgam describes its protocol as a decentralised lending exchange (DLEX) that combines lending and trading. Its official homepage says users can lend, trade and leverage assets without oracles. Lagoon Finance lists Ammalgam as the curator of its Ethereum WETH and USDC vaults.
