long_description: |
  [Techemy Capital](https://techemy.capital/about/) describes itself as a New Zealand-authorised digital-asset investment-management firm. Its [services page](https://techemy.capital/services/) and the [Holistic ETH-BTC portfolio page](https://techemy.capital/invest-in-defi/holistic-eth-btc-portfolio/) document its funds-management and DeFi offerings. Techemy's [Enzyme partnership announcement](https://www.globenewswire.com/news-release/2021/02/10/2173445/0/en/Techemy-Capital-and-Enzyme-Finance-Partner-to-Launch-Holistic-ETH-BTC-Portfolio.html) identifies the Enzyme portfolio relationship.
