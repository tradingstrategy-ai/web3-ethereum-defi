[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
solc_version = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
optimizer = true
optimizer_runs = 1
# Do not enable the Yul IR pipeline: at optimizer_runs=1 it produces larger
# deployed GuardV0 and TradingStrategyModuleV0 dispatcher bytecode, reducing
# their EIP-170 deployment margin. Keep both integration projects on this
# legacy pipeline and measure the top-level contracts after compiler changes.
via_ir = false
